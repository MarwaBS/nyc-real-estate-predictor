[project]
name = "nyc-price-prediction"
version = "1.0.0"
description = "NYC real estate price prediction with derived price zones (one XGBoost regressor)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
# Anchored to the repo root with a leading slash. Bare names match at ANY
# depth, so "models" and "data" also excluded src/models/ and src/data/ --
# eleven modules including cleaner.py, predict.py and pipelines.py were
# invisible to `ruff check .`, hiding 17 errors behind a green lint job.
exclude = ["/mlruns", "/models", "/data", "/output", "/Resources"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "N803", "N806"]
"notebooks/**" = ["E402", "F401"]
# `X` / `X_train` / `X_test` are the universal sklearn naming convention for
# feature matrices; renaming them to satisfy pep8-naming would make the ML
# code LESS readable to its audience.
"benchmarks/**" = ["N803", "N806"]
"run_training.py" = ["N803", "N806"]
"scripts/**" = ["N803", "N806"]
# Same convention, same reason. These were never listed because the exclude
# above hid src/models/ entirely, so their N803/N806 never surfaced.
"src/models/**" = ["N803", "N806"]

[tool.codespell]
# MAPE is the metric; unparseable is a variant codespell rewrites to
# unparsable. Both are correct here.
ignore-words-list = "mape,unparseable"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tests.*", "notebooks.*"]
disallow_untyped_defs = false

[tool.coverage.run]
# The serving path, the pipeline, and the script that writes the artefacts.
# scripts/ is left out: CI runs verify_gates.py as a subprocess and the
# measure_* scripts by hand, so line coverage of them measures nothing.
source = ["src", "benchmarks", "api", "run_training.py", "streamlit_app"]
# Every omit needs a reason that is not "it would lower the number".
omit = [
    "tests/*",
    "notebooks/*",
    # Network-bound: these download live NYC.gov data. Covered end-to-end by
    # the External Benchmark workflow on every push and weekly, which is a
    # stronger check than a mock would be. mapping.py and invariants.py — the
    # contract-bearing code — stay fully in scope.
    "benchmarks/run_benchmark.py",
    "benchmarks/datasets/*",
    "benchmarks/train_benchmark_model.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
