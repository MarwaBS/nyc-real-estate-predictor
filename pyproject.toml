[project]
name = "nyc-price-prediction"
version = "1.0.0"
description = "NYC real estate price zone classification and regression with ML + DL"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "mlruns", "models", "data"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "N803", "N806"]
"notebooks/**" = ["E402", "F401"]
# `X` / `X_train` / `X_test` are the universal sklearn naming convention for
# feature matrices; renaming them to satisfy pep8-naming would make the ML
# code LESS readable to its audience.
"benchmarks/**" = ["N803", "N806"]
"run_training.py" = ["N803", "N806"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tests.*", "notebooks.*"]
disallow_untyped_defs = false

[tool.coverage.run]
# api/ is in scope: it holds the serving + security controls (auth, rate
# limiting, /predict). Excluding it meant the coverage gate could go green while
# the API layer was untested — the exact "gate avoids the breakage" trap.
source = ["src", "benchmarks", "api"]
omit = [
    "tests/*",
    "notebooks/*",
    "streamlit_app/*",
    "src/models/train_classification.py",
    "src/models/train_regression.py",
    "src/dl/train_dl.py",
    "src/dl/tabular_net.py",
    "src/models/explain.py",
    # Network-bound benchmark modules: exercised end-to-end by the
    # External Benchmark workflow (real NYC.gov download + real model),
    # not by the hermetic unit suite. mapping.py and invariants.py — the
    # contract-bearing code — stay fully in scope.
    "benchmarks/run_benchmark.py",
    "benchmarks/datasets/*",
    "benchmarks/train_benchmark_model.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
