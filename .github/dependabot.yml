version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-patch-updates:
        update-types: ["patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

      # Frozen at their pins in requirements.txt, each with its reason there.
      - dependency-name: "numpy"
      - dependency-name: "scikit-learn"
      - dependency-name: "pandas"
      - dependency-name: "joblib"
      - dependency-name: "category-encoders"
      - dependency-name: "xgboost"
      - dependency-name: "scipy"
      - dependency-name: "schema-firewall"
      - dependency-name: "pandas-stubs"

      # numpy sits in their dependency tree, so a minor bump can start asking
      # for numpy 2 and leave the install with no solution. Patch updates,
      # including security patches, still arrive for all of them.
      # tests/test_dependency_freeze.py recomputes this set from installed
      # metadata across all three requirements files and fails on a new one.
      - dependency-name: "lightgbm"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "streamlit"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "shap"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "mlflow"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
