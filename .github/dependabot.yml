version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-patch-updates:
        update-types: ["patch"]
    ignore:
      # Patch only. numpy is held at 1.26.4 for the fitted artefacts, and any
      # minor bump can raise a transitive numpy floor past 1.x, which leaves
      # requirements.txt unsolvable. pip-audit still fails on advisories.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      # ── Frozen to the training environment ────────────────────────────
      # Referenced inside models/*.joblib. A different version changes estimator
      # internals silently, so moving one means retraining; src/models/predict.py
      # raises ModelVersionError if a mismatch gets this far.
      - dependency-name: "numpy"
      - dependency-name: "scikit-learn"
      - dependency-name: "pandas"
      - dependency-name: "joblib"
      - dependency-name: "category-encoders"
      - dependency-name: "xgboost"

      # scipy 1.18.0 is the first release requiring numpy>=2.
      - dependency-name: "scipy"

      # ── Frozen by a written decision ──────────────────────────────────
      # 0.2.x rebinned mutual information; benchmarks/invariants.py would need
      # its mi_threshold re-measured.
      - dependency-name: "schema-firewall"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
