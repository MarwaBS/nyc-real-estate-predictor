# Dependabot configuration (2026 industrial standard)
#
# Weekly grouped updates across pip + docker + github-actions — patch +
# minor grouped to reduce PR noise, majors always isolated because they
# tend to be breaking.

version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-patch-updates:
        update-types: ["patch"]
      python-minor-updates:
        update-types: ["minor"]
    ignore:
      # Major-version bumps are breaking by definition — manage manually
      # in a dedicated branch after reading the changelog. Otherwise
      # Dependabot fires off weekly pandas 2->3 / optuna 3->4 / h3 3->4
      # style PRs that always need rejection. This rule suppresses them.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

      # ── Frozen to the training environment ────────────────────────────
      # The shipped models are joblib pickles. Unpickling reconstructs
      # objects from these libraries, so the serving versions must equal the
      # ones the artefacts were fitted under (README: Python 3.12.13,
      # numpy 1.26.4, scikit-learn 1.8.0). A minor bump is enough to change
      # an estimator's internals, and the failure is silent — wrong numbers,
      # not an exception. The set below is the modules actually referenced
      # inside models/*.joblib, not a guess.
      # Moving any of them means retraining and re-validating, which is a
      # deliberate piece of work, not a dependency PR.
      # tests/test_artifact_contract.py fails the build if the installed
      # versions and the pins ever disagree.
      - dependency-name: "numpy"
      - dependency-name: "scikit-learn"
      - dependency-name: "pandas"
      - dependency-name: "joblib"
      - dependency-name: "category-encoders"
      - dependency-name: "xgboost"

      # ── Frozen to keep the requirements file resolvable ───────────────
      # numpy is held at 1.26.4 above. scipy 1.18.0 is the first release to
      # require numpy>=2.0.0, so any bump to it makes requirements.txt
      # unsolvable and every job dies at `pip install` — which is exactly
      # what happened to PR #83 and again to #88. scipy 1.17.0 still
      # supports numpy>=1.26.4, so the ceiling is real but not urgent.
      # Unfreeze this only together with the numpy 2 migration.
      - dependency-name: "scipy"

      # ── Frozen by a written decision ──────────────────────────────────
      # requirements.txt explains it at the pin: 0.2.x rebinned mutual
      # information from quantile to dense-rank, so benchmarks/invariants.py
      # would need its mi_threshold re-measured before moving.
      - dependency-name: "schema-firewall"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
