name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly clock: pip-audit and Trivy verdicts decay as new advisories are
  # disclosed against unchanged pins — a badge that only reruns on push stays
  # green over known-vulnerable deps (this exact failure shipped: pillow
  # PYSEC-2026-2253 sat behind a green push-only badge for a week). The cron
  # re-runs every gate against the live advisory feeds.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install lint tools
        # The full dev toolchain, not a hand-picked subset. mypy's result
        # depends on which typed packages are importable, so a partial install
        # made CI's type check disagree with the one run locally against
        # requirements-dev.txt — a gate that passes in one place and fails in
        # the other proves nothing. ruff/bandit are pinned in that file too.
        run: pip install -r requirements-dev.txt
      - name: ruff check
        # Whole tree, not a path list — a list drifts from the directories
        # that actually exist and quietly exempts them.
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy type check
        # Run against src/ + api/ + benchmarks/ so the benchmark pipeline is
        # type-checked too; `--ignore-missing-imports` prevents failures from
        # third-party libs (slowapi, xgboost, etc.) that don't ship stubs.
        run: mypy src/ api/ benchmarks/ --ignore-missing-imports
      - name: bandit security scan
        # Skip the tests tree (B101 asserts are normal in pytest) and the
        # .venv. Fail on MEDIUM+ findings.
        run: bandit -r src/ api/ benchmarks/ -n 3 -ll

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        # Floor 78, comfortably under the actual coverage over the full source
        # set (src/ + api/ + benchmarks/ + run_training.py). The gap gives churn
        # headroom while losing a module's worth of coverage still fails. The
        # omit list holds only the network-bound benchmark modules, which the
        # External Benchmark workflow exercises end-to-end on every push.
        run: pytest tests/ -v --tb=short --cov=src --cov=benchmarks --cov=api --cov=run_training --cov-report=term-missing --cov-report=xml --cov-fail-under=78
      - name: Verify the gates can fail
        # The step above proves the code passes its tests; this one proves the
        # tests can fail. Without it, a gate that reads a committed artefact CI
        # never regenerates stays green on broken code.
        run: python scripts/verify_gates.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit
      - name: pip-audit (dependency vulnerability scan)
        # PYSEC-2024-277 (joblib, CVE-2024-34997) is a disputed, no-fix
        # advisory about deserializing UNTRUSTED joblib/pickle artifacts.
        # This service only loads its own CI-trained model files, never
        # user-supplied pickles, so the attack precondition never holds and
        # no patched joblib release exists. Revisit if a fix ships.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-277
      - name: Generate SBOM (CycloneDX JSON)
        # Software Bill of Materials — standard supply-chain artifact.
        # Stored as a 90-day CI artifact.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-277 --format=cyclonedx-json --output=sbom.cyclonedx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.run_number }}
          path: sbom.cyclonedx.json
          retention-days: 90

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (GH Actions runner)
        # Default runner has ~14GB free. Our builder stage pulls pandas +
        # numpy + xgboost + lightgbm + streamlit + their transitives, plus
        # GHA cache layers; buildx occasionally runs out of inodes before
        # the runtime layer is assembled. Jlumbroso's action frees ~15GB
        # by removing preinstalled Android SDK, .NET, dotnet, CodeQL, etc.
        # — tools we don't use in the build.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute weekly cache epoch
        # ISO year-week. Feeds the Dockerfile's CACHE_EPOCH arg so the
        # OS-patch layer's cache key rolls over weekly: a RUN layer is
        # otherwise reused verbatim from the GHA cache and `apt-get
        # upgrade` never re-executes — which is how a fixed curl CVE
        # (CVE-2026-5773, deb12u15) stayed in the image while the badge
        # was green. Within a week, builds stay fully cached.
        id: epoch
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Build multi-stage Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          pull: true
          tags: nyc-price-prediction:ci
          build-args: |
            CACHE_EPOCH=${{ steps.epoch.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — scan built image for HIGH/CRITICAL CVEs
        # Container-layer vulnerability scan complementary to pip-audit.
        # `.trivyignore` at repo root holds managed-risk CVE IDs (currently
        # empty).
        # SHA-pinned, not tag-pinned: a tag is a mutable ref the upstream owner
        # can repoint at any commit, so `@v0.36.0` grants this third party
        # push-time control over a job that reads the repo and its token.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nyc-price-prediction:ci
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: .trivyignore
      - name: Smoke-run the built image
        # Start container, poll /health, stop. Catches runtime import
        # failures + missing deps before any deploy can see the image.
        run: |
          docker run -d --name pp-smoke -p 8000:8000 nyc-price-prediction:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API healthy after ${i}s"
              docker stop pp-smoke && docker rm pp-smoke
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become healthy within 30s" >&2
          docker logs pp-smoke
          docker stop pp-smoke && docker rm pp-smoke
          exit 1
